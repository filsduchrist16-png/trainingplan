<!doctype html>
<html lang="fr-CA" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f201b" />
    <meta name="description" content="Plans d'entraînement route et trail. Tes données restent sur ton appareil." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Sentier</title>
    <script>
      // Applique le thème avant le premier rendu pour éviter un flash clair à 5 h du matin.
      try {
        var t = localStorage.getItem('sentier.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        else if (t === 'system' && matchMedia('(prefers-color-scheme: light)').matches) document.documentElement.dataset.theme = 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
