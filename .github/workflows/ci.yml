name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # Déploie sur Cloudflare Pages seulement si tout est vert.
  # main → production ; autre branche → URL de preview (<branche>.sentier.pages.dev).
  # Nécessite les secrets CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID (voir docs/DEPLOIEMENT.md).
  deploy:
    needs: check
    runs-on: ubuntu-latest
    # Les PR venant de forks n'ont pas accès aux secrets ; les push de branche suffisent pour les previews.
    if: github.event_name == 'push'
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: true
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@4.151.3
    steps:
      - name: Secrets présents ?
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Secrets Cloudflare absents — déploiement ignoré (voir docs/DEPLOIEMENT.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Créer le projet Pages s'il n'existe pas
        if: steps.secrets.outputs.ok == 'true'
        run: |
          if ! $WRANGLER pages project list | grep -qw sentier; then
            $WRANGLER pages project create sentier --production-branch=main
          fi
      - name: Déployer
        if: steps.secrets.outputs.ok == 'true'
        run: $WRANGLER pages deploy --branch="${GITHUB_REF_NAME}" --commit-hash="${GITHUB_SHA}" --commit-dirty=true
